<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMGO!</title>
    <meta name="description" content="BIMGO! 공식 웹사이트">
    <style>
        @font-face {
            font-family: "DungGeunMo";
            src: url("./assets/fonts/DungGeunMo.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "x12y12pxMaruMinyaHangul";
            src: url("./assets/fonts/x12y12pxMaruMinyaHangul.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DungGeunMo", sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.7;
        }

        body.lang-jp,
        body.lang-jp * {
            font-family: "x12y12pxMaruMinyaHangul", sans-serif !important;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .lang-switch-container {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 24px;
        }

        .lang-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: #e2e2e2;
        }

        .lang-btn.active {
            background: #222;
            color: #fff;
            border-color: #222;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .description {
            margin-bottom: 32px;
            color: #666;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: block;
            padding: 16px 20px;
            border-radius: 10px;
            background: #f0f0f0;
            color: #222;
            text-decoration: none;
            font-weight: 400;
            transition: background 0.2s;
        }

        .link:hover {
            background: #e4e4e4;
        }

        footer {
            margin-top: 32px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <div class="lang-switch-container">
            <button class="lang-btn" onclick="setLanguage('ko')">한국어</button>
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('jp')">日本語</button>
        </div>

        <h1>BIMGO!</h1>

        <p class="description" id="txt-desc">
            BIMGO! 공식 웹사이트입니다.
        </p>

        <div class="links">
            <a class="link" id="link-privacy" href="privacy.html">
                개인정보처리방침
            </a>

            <a class="link" id="link-delete" href="delete.html">
                게임 데이터 생성 & 삭제 안내
            </a>
        </div>
    </div>

    <footer id="txt-footer">
        개발자: BIMGO_Dev · © 2026 BIMGO
    </footer>
</div>

<script>
    const i18nData = {
        ko: {
            desc: "BIMGO! 공식 웹사이트입니다.",
            privacy: "개인정보처리방침",
            delete: "게임 데이터 생성 & 삭제 안내",
            footer: "개발자: BIMGO_Dev · © 2026 BIMGO"
        },
        en: {
            desc: "Welcome to the official website of BIMGO!",
            privacy: "Privacy Policy",
            delete: "Game Data Creation & Deletion Guide",
            footer: "Developer: BIMGO_Dev · © 2026 BIMGO"
        },
        jp: {
            desc: "BIMGO! 公式ウェブサイトです。",
            privacy: "プライバシーポリシー",
            delete: "ゲームデータ作成・削除のご案内",
            footer: "開発者: BIMGO_Dev · © 2026 BIMGO"
        }
    };

    function setLanguage(lang) {
        if (!i18nData[lang]) lang = 'ko';

        document.getElementById("txt-desc").textContent = i18nData[lang].desc;
        document.getElementById("link-privacy").textContent = i18nData[lang].privacy;
        document.getElementById("link-delete").textContent = i18nData[lang].delete;
        document.getElementById("txt-footer").textContent = i18nData[lang].footer;

        // 링크 이동 시 언어 파라미터 유지
        document.getElementById("link-privacy").href = `privacy.html?lang=${lang}`;
        document.getElementById("link-delete").href = `delete.html?lang=${lang}`;

        if (lang === 'jp') {
            document.body.classList.add('lang-jp');
        } else {
            document.body.classList.remove('lang-jp');
        }

        const buttons = document.querySelectorAll('.lang-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (lang === 'ko') buttons[0].classList.add('active');
        else if (lang === 'en') buttons[1].classList.add('active');
        else if (lang === 'jp') buttons[2].classList.add('active');

        localStorage.setItem('bimgo_lang', lang);
        document.documentElement.lang = lang;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const savedLang = urlParams.get('lang') || localStorage.getItem('bimgo_lang') || 'ko';
        setLanguage(savedLang);
    });
</script>

</body>
</html>
